# ai-adapter 設定ファイルサンプル
# 実際の設定は ~/.ai-adapter/config.yaml に保存されます
version: 1
default_env: default
agent_bindings:
  - agent: reviewer
    env: myhome
  - agent: implementer
    env: office
agents:
  - name: reviewer
    description: "コードレビュー用エージェント"
  - name: implementer
    description: "実装用エージェント"
envs:
  - name: default
    description: "デフォルト環境"
  - name: myhome
    description: "自宅開発環境"
  - name: office
    description: "会社開発環境"
bins:
  - name: deploy-prod.sh
    env: myhome
    description: "本番デプロイ"
  - name: deploy-staging.sh
    env: myhome
    description: "ステージングデプロイ"
  - name: format-all.sh
    env: default
    description: "コード整形"
