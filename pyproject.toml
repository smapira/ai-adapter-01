[project]
name = "ai-adapter"
version = "0.1.0"
description = "AIエージェント・スクリプトの共通管理基盤 CLI ツール"
authors = [
    { name = "smapira" },
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
]

[project.scripts]
ai-adapter = "ai_adapter.cli:main"

[project.entry-points."ai_adapter.plugins"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
