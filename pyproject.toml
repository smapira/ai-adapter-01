[project]
name = "ai-adapter"
version = "0.15.0"
description = "Unified CLI tool for managing AI agent configurations and scripts"
authors = [
    { name = "smapira" },
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
    "pyyaml>=6.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control",
    "Topic :: Utilities",
]
keywords = ["ai", "agent", "cli", "mcp", "github", "copilot", "claude", "opencode"]

[project.urls]
Homepage = "https://github.com/smapira/ai-adapter-01"
Repository = "https://github.com/smapira/ai-adapter-01"
Changelog = "https://github.com/smapira/ai-adapter-01/blob/main/CHANGELOG.md"

[project.scripts]
ai-adapter = "ai_adapter.cli:main"

[project.entry-points."ai_adapter.plugins"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_adapter"]
exclude = ["tests/", "documents/", "scripts/", "plan.md"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/CHANGELOG.md",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/examples",
    "/.github",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]
